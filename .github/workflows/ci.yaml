name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Format, lint, and typecheck
        run: vp check

      - name: Test
        run: vp test

      - name: Build and prerender
        run: vp run build
